name: Deploy Round-2 persistence workaround to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qonsul-website-staging-reconciliation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: website-staging-deployment
    env:
      QONSUL_COCKPIT_INTAKE_URL: ${{ vars.QONSUL_COCKPIT_INTAKE_URL }}
      STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
      STAGING_D1_DATABASE_NAME: ${{ vars.STAGING_D1_DATABASE_NAME }}
      STAGING_CLOUDFLARE_ACCOUNT_ID: ${{ vars.STAGING_CLOUDFLARE_ACCOUNT_ID }}
      STAGING_WORKER_NAME: qonsul-website-staging-reconciliation

    steps:
      - name: Require the dedicated manual Staging branch
        run: |
          test "${GITHUB_EVENT_NAME}" = 'workflow_dispatch'
          test "${GITHUB_REF}" = 'refs/heads/staging/round-two-persistence-workaround'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source identity
        id: source
        run: |
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          printf 'commit=%s\n' "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          printf 'build_id=%s:%s\n' "${GITHUB_SHA}" "${SOURCE_TREE}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify source
        run: |
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm lint
      - name: Build the Staging workaround
        env:
          CF_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.STAGING_D1_DATABASE_NAME }}
          SOURCE_COMMIT_SHA: ${{ steps.source.outputs.commit }}
          SOURCE_BUILD_ID: ${{ steps.source.outputs.build_id }}
          PUBLIC_SITE_URL: https://qonsul-website-staging-reconciliation.qonsul.workers.dev
          NEXT_PUBLIC_QONSUL_ANALYTICS_ENDPOINT: https://cockpit-staging.qonsul.de/api/v1/analytics/events
        run: corepack pnpm build
      - name: Deploy only to the fixed Staging Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: >-
          corepack pnpm dlx --package wrangler@4.127.1 wrangler deploy
          --config dist/server/wrangler.json
          --name "${STAGING_WORKER_NAME}"
          --keep-vars
          --tag staging-r2-persistence-${{ github.run_id }}
      - name: Verify public Staging identity and readiness
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_BUILD_ID: ${{ steps.source.outputs.build_id }}
        run: |
          node --input-type=module -e "const response=await fetch('https://qonsul-website-staging-reconciliation.qonsul.workers.dev/api/status'); if(!response.ok)throw new Error('Staging status request failed'); const status=await response.json(); if(status.productionReady!==false||status.ai!==true||status.diagnosticReady!==true||status.candidateIdentity?.commit!==process.env.EXPECTED_COMMIT||status.candidateIdentity?.buildId!==process.env.EXPECTED_BUILD_ID)throw new Error('Staging status contract failed'); console.log('PASS Staging identity and readiness');"
