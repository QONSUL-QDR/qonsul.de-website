name: Deploy Phase-13 staging reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-staging-reconciliation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy only the isolated staging Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: website-staging-deployment
    steps:
      - name: Require the dedicated staging branch
        run: test "${GITHUB_REF}" = 'refs/heads/staging/phase-13-e2e-reconciliation'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and deploy the verified staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          STAGING_D1_DATABASE_NAME: ${{ vars.STAGING_D1_DATABASE_NAME }}
          STAGING_DEPLOY_ID: staging-gh-${{ github.run_id }}
        run: node scripts/deploy-staging-worker.mjs
